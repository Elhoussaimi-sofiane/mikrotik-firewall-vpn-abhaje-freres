<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#12304a" flood-opacity="0.13"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#176b87"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#6f42c1"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2e7d32"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#f5f8fb"/>

  <text x="80" y="66" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#12304a">
    Architecture réseau - Pare-feu MikroTik et VPN
  </text>
  <text x="80" y="101" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5e6c76">
    Laboratoire validé pour la Société Abhaje Frères
  </text>

  <!-- Internet -->
  <g filter="url(#shadow)">
    <rect x="646" y="126" width="308" height="82" rx="41" fill="#ffffff" stroke="#176b87" stroke-width="3"/>
  </g>
  <text x="800" y="160" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#12304a">
    INTERNET
  </text>
  <text x="800" y="187" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5e6c76">
    Réseau externe / fournisseur d'accès
  </text>

  <!-- WAN zone -->
  <line x1="800" y1="208" x2="800" y2="238" stroke="#176b87" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <g filter="url(#shadow)">
    <rect x="205" y="245" width="1190" height="100" rx="22" fill="#eaf3f7" stroke="#176b87" stroke-width="3"/>
  </g>
  <text x="800" y="280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#12304a">
    ZONE WAN / INTERNET
  </text>
  <text x="800" y="311" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#25313a">
    UTM Shared Network : 192.168.64.0/24  |  Passerelle NAT UTM : 192.168.64.1
  </text>
  <text x="800" y="334" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5e6c76">
    Dans l'entreprise réelle, cette zone sera remplacée par les connexions WAN des fournisseurs Internet
  </text>

  <!-- WAN links -->
  <path d="M520 345 L520 392" fill="none" stroke="#176b87" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <path d="M1080 345 L1080 392" fill="none" stroke="#176b87" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="540" y="374" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#176b87">ether1 - WAN</text>
  <text x="1100" y="374" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#176b87">ether1 - WAN</text>

  <!-- R1 -->
  <g filter="url(#shadow)">
    <rect x="330" y="400" width="380" height="170" rx="22" fill="#fff3e6" stroke="#f08a24" stroke-width="4"/>
  </g>
  <rect x="330" y="400" width="380" height="44" rx="20" fill="#f08a24"/>
  <rect x="330" y="422" width="380" height="22" fill="#f08a24"/>
  <text x="520" y="430" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#ffffff">
    R1-HQ - PARE-FEU PRINCIPAL
  </text>
  <text x="520" y="477" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#12304a">
    WAN : 192.168.64.2
  </text>
  <text x="520" y="506" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#25313a">
    LAN : 10.10.10.1/24
  </text>
  <text x="520" y="535" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5e6c76">
    Firewall + NAT + DHCP + VPN employés
  </text>

  <!-- R2 -->
  <g filter="url(#shadow)">
    <rect x="890" y="400" width="380" height="170" rx="22" fill="#fff3e6" stroke="#f08a24" stroke-width="4"/>
  </g>
  <rect x="890" y="400" width="380" height="44" rx="20" fill="#f08a24"/>
  <rect x="890" y="422" width="380" height="22" fill="#f08a24"/>
  <text x="1080" y="430" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#ffffff">
    R2-BRANCH - PARE-FEU
  </text>
  <text x="1080" y="477" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#12304a">
    WAN : 192.168.64.4
  </text>
  <text x="1080" y="506" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#25313a">
    LAN : 10.30.30.1/24
  </text>
  <text x="1080" y="535" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5e6c76">
    Firewall + NAT + DHCP Branch
  </text>

  <!-- S2S VPN -->
  <line x1="710" y1="486" x2="890" y2="486" stroke="#6f42c1" stroke-width="7"/>
  <polygon points="720,476 704,486 720,496" fill="#6f42c1"/>
  <polygon points="880,476 896,486 880,496" fill="#6f42c1"/>
  <rect x="704" y="451" width="192" height="27" rx="13" fill="#6f42c1"/>
  <text x="800" y="470" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#ffffff">
    VPN SITE-À-SITE
  </text>
  <text x="800" y="516" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#6f42c1">
    WireGuard UDP 13232
  </text>

  <!-- Remote employee -->
  <g filter="url(#shadow)">
    <rect x="40" y="404" width="240" height="155" rx="20" fill="#f1ebff" stroke="#6f42c1" stroke-width="3"/>
  </g>
  <text x="160" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#12304a">
    EMPLOYÉ DISTANT
  </text>
  <text x="160" y="471" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#25313a">
    Remote-Employee-Test
  </text>
  <text x="160" y="500" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6f42c1">
    VPN : 10.20.20.2
  </text>
  <text x="160" y="531" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b3261e">
    Sans VPN : accès HQ bloqué
  </text>
  <path d="M280 482 L330 482" fill="none" stroke="#6f42c1" stroke-width="6" marker-end="url(#arrowPurple)"/>
  <rect x="252" y="444" width="106" height="25" rx="12" fill="#6f42c1"/>
  <text x="305" y="461" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#ffffff">
    VPN EMPLOYÉS
  </text>

  <!-- LAN links -->
  <path d="M520 570 L520 628" fill="none" stroke="#2e7d32" stroke-width="5" marker-end="url(#arrowGreen)"/>
  <path d="M1080 570 L1080 628" fill="none" stroke="#2e7d32" stroke-width="5" marker-end="url(#arrowGreen)"/>
  <text x="540" y="606" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2e7d32">ether2 - LAN</text>
  <text x="1100" y="606" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2e7d32">ether2 - LAN</text>

  <!-- HQ LAN -->
  <g filter="url(#shadow)">
    <rect x="270" y="640" width="500" height="155" rx="22" fill="#e9f4ff" stroke="#3182ce" stroke-width="3"/>
  </g>
  <text x="520" y="677" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#12304a">
    SIÈGE - HQ-LAN
  </text>
  <text x="520" y="706" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#25313a">
    Réseau protégé : 10.10.10.0/24
  </text>
  <rect x="357" y="728" width="326" height="45" rx="12" fill="#ffffff" stroke="#3182ce" stroke-width="2"/>
  <text x="520" y="757" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#176b87">
    Ubuntu HQ : 10.10.10.200
  </text>

  <!-- Branch LAN -->
  <g filter="url(#shadow)">
    <rect x="830" y="640" width="500" height="155" rx="22" fill="#eaf7ed" stroke="#2e7d32" stroke-width="3"/>
  </g>
  <text x="1080" y="677" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#12304a">
    SUCCURSALE - BRANCH-LAN
  </text>
  <text x="1080" y="706" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#25313a">
    Réseau protégé : 10.30.30.0/24
  </text>
  <rect x="917" y="728" width="326" height="45" rx="12" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="1080" y="757" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#2e7d32">
    DHCP : 10.30.30.100 - 10.30.30.200
  </text>

  <!-- Legend -->
  <rect x="270" y="827" width="1060" height="47" rx="16" fill="#ffffff" stroke="#cad7dd" stroke-width="2"/>
  <circle cx="342" cy="850" r="9" fill="#f08a24"/>
  <text x="360" y="856" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#25313a">Pare-feu MikroTik</text>
  <circle cx="570" cy="850" r="9" fill="#176b87"/>
  <text x="588" y="856" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#25313a">WAN / Internet</text>
  <circle cx="790" cy="850" r="9" fill="#6f42c1"/>
  <text x="808" y="856" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#25313a">Tunnels VPN chiffrés</text>
  <circle cx="1058" cy="850" r="9" fill="#2e7d32"/>
  <text x="1076" y="856" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#25313a">Réseaux internes protégés</text>
</svg>
